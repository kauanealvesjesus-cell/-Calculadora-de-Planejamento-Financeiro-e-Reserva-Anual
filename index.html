
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planejamento Financeiro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>💰 Planejamento Financeiro</h1>
        <p>Aprendendo a economizar e investir!</p>
    </header>

    <main>

        <section class="painel">

            <h2>Dados da simulação</h2>

            <label for="salario">
                Salário mensal inicial (R$):
            </label>

            <input
                type="number"
                id="salario"
                value="1500"
                min="0"
                step="0.01"
            >

            <label for="aumento">
                Aumento anual do salário (%):
            </label>

            <input
                type="number"
                id="aumento"
                value="5"
                min="0"
                step="0.1"
            >

            <label for="reserva">
                Reserva anual (% do salário):
            </label>

            <input
                type="number"
                id="reserva"
                value="120"
                min="0"
                step="0.1"
            >

            <label for="rendimento">
                Rendimento anual (%):
            </label>

            <input
                type="number"
                id="rendimento"
                value="10"
                min="0"
                step="0.1"
            >

            <label for="anos">
                Quantidade de anos:
            </label>

            <input
                type="number"
                id="anos"
                value="10"
                min="1"
                max="100"
                step="1"
            >

            <button onclick="calcular()">
                Calcular planejamento
            </button>

        </section>

        <section class="resultado">

            <h2>Resultado da simulação</h2>

            <div class="destaque">
                <p>Patrimônio acumulado:</p>
                <h2 id="total">R$ 0,00</h2>
            </div>

            <div class="tabela-container">

                <table>

                    <thead>
                        <tr>
                            <th>Ano</th>
                            <th>Salário mensal</th>
                            <th>Reserva anual</th>
                            <th>Valor inicial</th>
                            <th>Rendimento</th>
                            <th>Valor final</th>
                        </tr>
                    </thead>

                    <tbody id="tabela">

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>Projeto escolar - Educação Financeira</p>
        <p>Aprendendo programação na prática ❤️</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
